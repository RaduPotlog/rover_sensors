# Shared by both nodes in launch/rover_gps.launch.py.

# rover_gps_driver (rover_gps/rover_gps_driver_node): receives the NMEA sentences the
# RUTX11 forwards over UDP (GPS > NMEA > NMEA forwarding -> <rover IP>:10110, UDP).
# Lifecycle node; the launch file brings it straight to active.
/**/rover_gps_driver:
  ros__parameters:
    ip: "0.0.0.0"          # listen on every interface; the RUTX11 sends to the rover LAN address
    port: 10110
    buffer_size: 4096
    timeout_sec: 2
    frame_id: "gps_link"   # the launch file passes the namespace as tf_prefix
    time_ref_source: "gps"
    useRMC: false          # GGA carries fix quality and HDOP, which set the fix covariance

/**/rover_gps_node:
  ros__parameters:
    # GPS fix diagnostics
    expected_rate_hz: 1.0         # RUTX11 NMEA forwarding default
    min_rate_ratio: 0.5
    fix_timeout_s: 3.0
    warn_horizontal_std_m: 5.0
    error_horizontal_std_m: 20.0
    # Set by the launch file from ROVER_LOCALIZATION_SOURCE: false for indoor, slam and amcl,
    # where nothing localizes on GPS, so indoor accuracy (tens of metres) or a GPS that is
    # switched off (no data / data timeout) is only a warning.
    gps_required: true

