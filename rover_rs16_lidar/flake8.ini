# ament_flake8's default configuration (ament_flake8/configuration/ament_flake8.ini) plus Q000:
# the launch files use double quotes, like every other rover_* launch file.
[flake8]
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202,Q000
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
