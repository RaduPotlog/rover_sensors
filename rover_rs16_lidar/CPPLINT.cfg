# Configuration for ament_cmake_cpplint, mirroring rover_ros/rover_hardware_interface/CPPLINT.cfg.
# Applies to this directory and all subdirectories.
set noparent

# build/header_guard: guards are <PKG>_<PATH>_HPP_ - self-consistent, but not cpplint's
# double-underscore algorithm, so every header would be a false positive.
# whitespace/blank_line: blank line after "public:"/"private:" is house style.
# whitespace/line_length: house style caps at ~100 columns by eye rather than a hard limit;
# RCLCPP_* calls and parameter descriptions run past it.
filter=-build/header_guard,-whitespace/blank_line,-whitespace/line_length
